name: Test default_match input - fallback when no label matches
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pull_request event payload with no matching labels
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 1,
              "labels": []
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/event/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          allowed: "bug, feature, enhancement"
          default_match: "no-label"

      - name: Assert match output equals default_match value
        env:
          ACTUAL: ${{ steps.action.outputs.match }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "no-label" ]; then
            echo "FAIL: expected 'no-label' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
