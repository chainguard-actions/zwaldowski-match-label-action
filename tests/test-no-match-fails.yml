name: Test no match fails without default_match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          allowed: "bug, enhancement, documentation"
      - name: Assert action failed (no matching label, no default)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no labels match and no default_match is set"
            exit 1
          fi
          echo "PASS: action correctly failed when no matching label found"
