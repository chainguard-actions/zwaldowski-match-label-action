name: Test allowed_multiple with default_match fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          allowed_multiple: "bug, enhancement, documentation"
          default_match: "bug"
      - name: Assert match output equals default_match
        env:
          ACTUAL: ${{ steps.action.outputs.match }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "bug" ]; then
            echo "FAIL: expected 'bug' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
